<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#164230"/>
      <stop offset="1" stop-color="#142D20"/>
    </radialGradient>
    <path id="arcTop" d="M300 215 A100 100 0 0 1 500 215"/>
    <path id="arcBottom" d="M294 215 A106 106 0 0 0 506 215"/>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- badge rings, echoing the Tasty Malmö logo -->
  <circle cx="400" cy="215" r="132" fill="none" stroke="#F3BE70" stroke-width="2" opacity="0.9"/>
  <circle cx="400" cy="215" r="124" fill="none" stroke="#F3BE70" stroke-width="1" opacity="0.6"/>
  <path d="M345 156 A80 80 0 0 1 474 183" fill="none" stroke="#F3BE70" stroke-width="1" opacity="0.6"/>
  <path d="M455 273 A80 80 0 0 1 326 248" fill="none" stroke="#F3BE70" stroke-width="1" opacity="0.6"/>

  <!-- curved text -->
  <text font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="17" letter-spacing="6" fill="#F3BE70">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">RESTAURANTS</textPath>
  </text>
  <text font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="17" letter-spacing="6" fill="#F3BE70">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle" dominant-baseline="hanging">IN MALMÖ</textPath>
  </text>

  <!-- cloche -->
  <g fill="none" stroke="#F3BE70" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M362 222 a38 38 0 0 1 76 0"/>
    <path d="M350 224 h100"/>
    <path d="M385 200 a24 24 0 0 1 14 -10" opacity="0.7"/>
  </g>
  <circle cx="400" cy="178" r="5" fill="#F3BE70"/>

  <!-- fork & knife flanking -->
  <g fill="none" stroke="#F3BE70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M222 165 v28 a12 12 0 0 0 24 0 v-28"/>
    <path d="M234 165 v30"/>
    <path d="M234 205 v70"/>
  </g>
  <path d="M566 165 c15 7 19 32 19 52 h-19 z" fill="#F3BE70" opacity="0.85"/>
  <path d="M575.5 217 v58" stroke="#F3BE70" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

  <text x="400" y="400" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="5" fill="#F3BE70">NO PHOTO YET</text>
</svg>
